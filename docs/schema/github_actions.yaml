    - gha:output_expression
    is_a: output_expression
    domain: GhaWorkflowOutput
    slot_uri: gha:output_expression
    alias: output_expression
    owner: GhaWorkflowOutput
    domain_of:
    - GhaWorkflowOutput
    is_usage_slot: true
    usage_slot_name: output_expression
    range: string
    required: true
  GhaAction_inputs:
    name: GhaAction_inputs
    definition_uri: https://w3id.org/lmodel/github-actions/inputs
    description: The inputs under the metadata file's `inputs` key.
    from_schema: https://w3id.org/lmodel/github-actions/github_actions_core
    is_a: inputs
    domain: GhaAction
    slot_uri: gha:inputs
    alias: inputs
    owner: GhaAction
    domain_of:
    - GhaAction
    is_usage_slot: true
    usage_slot_name: inputs
    range: GhaActionInput
    multivalued: true
    inlined: true
    inlined_as_list: true
  GhaAction_outputs:
    name: GhaAction_outputs
    definition_uri: https://w3id.org/lmodel/github-actions/outputs
    description: The outputs under the metadata file's `outputs` key.
    from_schema: https://w3id.org/lmodel/github-actions/github_actions_core
    is_a: outputs
    domain: GhaAction
    slot_uri: gha:outputs
    alias: outputs
    owner: GhaAction
    domain_of:
    - GhaAction
    is_usage_slot: true
    usage_slot_name: outputs
    range: GhaActionOutput
    multivalued: true
    inlined: true
    inlined_as_list: true
  GhaActionInput_description:
    name: GhaActionInput_description
    definition_uri: https://w3id.org/lmodel/github-actions/description
    description: What the input, output or secret is for, as the file describes it.
    comments:
    - It means what LOKF's description means and carries the same IRI, so lokf adapt
      folds it into LOKF's slot and a knowledge bundle reads one description key.
    from_schema: https://w3id.org/lmodel/github-actions/github_actions_core
    mappings:
    - schema:description
    is_a: description
    domain: GhaActionInput
    slot_uri: schema:description
    alias: description
    owner: GhaActionInput
    domain_of:
    - GhaActionInput
    is_usage_slot: true
    usage_slot_name: description
    range: string
    required: true
  GhaActionOutput_description:
    name: GhaActionOutput_description
    definition_uri: https://w3id.org/lmodel/github-actions/description
    description: What the input, output or secret is for, as the file describes it.
    comments:
    - It means what LOKF's description means and carries the same IRI, so lokf adapt
      folds it into LOKF's slot and a knowledge bundle reads one description key.
    from_schema: https://w3id.org/lmodel/github-actions/github_actions_core
    mappings:
    - schema:description
    is_a: description
    domain: GhaActionOutput
    slot_uri: schema:description
    alias: description
    owner: GhaActionOutput
    domain_of:
    - GhaActionOutput
    is_usage_slot: true
    usage_slot_name: description
    range: string
    required: true
classes:
  GhaDocument:
    name: GhaDocument
    definition_uri: https://w3id.org/lmodel/github-actions/GhaDocument
    description: A document that holds the workflows, actions, rulesets and required
      status checks of one or more repositories.
    from_schema: https://w3id.org/lmodel/github-actions
    exact_mappings:
    - gha:Document
    slots:
    - ghaDocument__workflows
    - ghaDocument__reusable_workflows
    - ghaDocument__actions
    - ghaDocument__rulesets
    - ghaDocument__required_checks
    attributes:
      workflows:
        name: workflows
        description: The workflows other than the reusable ones.
        range: GhaWorkflow
        multivalued: true
        inlined: true
        inlined_as_list: true
      reusable_workflows:
        name: reusable_workflows
        description: The reusable workflows.
        range: GhaReusableWorkflow
        multivalued: true
        inlined: true
        inlined_as_list: true
      actions:
        name: actions
        description: The actions.
        range: GhaAction
        multivalued: true
        inlined: true
        inlined_as_list: true
      rulesets:
        name: rulesets
        description: The rulesets.
        range: GhaRepositoryRuleset
        multivalued: true
        inlined: true
        inlined_as_list: true
      required_checks:
        name: required_checks
        description: The status checks the rulesets require.
        range: GhaRequiredStatusCheck
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: gha:Document
    tree_root: true
  GhaRequiredMixin:
    name: GhaRequiredMixin
    definition_uri: https://w3id.org/lmodel/github-actions/GhaRequiredMixin
    description: The field that says whether a caller must supply a value.
    from_schema: https://w3id.org/lmodel/github-actions/github_actions_core
    mixin: true
    slots:
    - ghaRequiredMixin__required
    attributes:
      required:
        name: required
        description: Whether a caller must supply a value.
        comments:
        - 'An attribute rather than a slot: it carries LOKF''s IRI for required, and
          lokf adapt keeps an attribute''s name, where it would rename a slot that
          shares one with lokf.yaml.'
        slot_uri: schema:valueRequired
        range: boolean
    class_uri: gha:GhaRequiredMixin
  GhaInput:
    name: GhaInput
    definition_uri: https://w3id.org/lmodel/github-actions/GhaInput
    description: An input that a reusable workflow or an action declares, under the
      key a caller writes in its `with` map.
    from_schema: https://w3id.org/lmodel/github-actions/github_actions_core
    exact_mappings:
    - gha:Input
    abstract: true
    mixins:
    - GhaRequiredMixin
    slots:
    - description
    - ghaInput__input_id
    - ghaInput__default
    - ghaRequiredMixin__required
    attributes:
      input_id:
        name: input_id
        description: The key a caller writes in its `with` map.
        range: gha_identifier
        required: true
      default:
        name: default
        description: The value used when a caller supplies none, written as a string
          even where the input's type is a boolean or a number.
    class_uri: gha:Input
  GhaOutput:
    name: GhaOutput
    definition_uri: https://w3id.org/lmodel/github-actions/GhaOutput
    description: An output that a reusable workflow or an action declares for the
      job or step that calls it to read.
    from_schema: https://w3id.org/lmodel/github-actions/github_actions_core
    exact_mappings:
    - gha:Output
    abstract: true
    slots:
    - description
    - output_expression
    - ghaOutput__output_id
    attributes:
      output_id:
        name: output_id
        description: The key a caller reads the output by.
        range: gha_identifier
        required: true
    class_uri: gha:Output
  GhaWorkflow:
    name: GhaWorkflow
    definition_uri: https://w3id.org/lmodel/github-actions/GhaWorkflow
    description: 'A workflow file in a repository''s `.github/workflows` directory:
      the events that run it, the access its GITHUB_TOKEN gets, and its jobs.'
    comments:
    - SPDX 3.0.1's Build records one run of a build, such as a run of this workflow,
      so it is a related term and not a close one.
    - The ref a run checks the file out at belongs to the run, and GitHub's build
      type records it in provenance as workflow.ref; it is not a fact of the file,
      so it is not modelled here.
    from_schema: https://w3id.org/lmodel/github-actions/github_actions_workflow
    see_also:
    - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
    exact_mappings:
    - gha:Workflow
    close_mappings:
    - cdx:workflow
    related_mappings:
    - spdx_build:Build
    slots:
    - GhaWorkflow_triggers
    - ghaWorkflow__workflow_uri
    - ghaWorkflow__workflow_path
    - ghaWorkflow__workflow_repository
    - ghaWorkflow__permissions
    - ghaWorkflow__jobs
    slot_usage:
      triggers:
        name: triggers
        required: true
    attributes:
      workflow_uri:
        name: workflow_uri
        description: 'The file''s address on its forge without a ref: `https://github.com/<owner>/<repo>/.github/workflows/<file>`.'
        comments:
        - GitHub's build type forms a reusable workflow's builder.id from this address,
          followed by `@` and the ref.
        identifier: true
        range: uri
      workflow_path:
        name: workflow_path
        description: The file's path from the repository root, as GitHub's build type
          writes workflow.path. GitHub reads no subdirectory of `.github/workflows`.
        see_also:
        - https://actions.github.io/buildtypes/workflow/v1
        required: true
        pattern: ^\.github/workflows/[^/]+\.ya?ml$
      workflow_repository:
        name: workflow_repository
        description: 'The repository that holds the file, as GitHub''s build type
          writes workflow.repository: an HTTPS address without `.git`.'
        see_also:
        - https://actions.github.io/buildtypes/workflow/v1
        range: uri
        pattern: ^https://[^/]+/[^/]+/[^/]+$
      permissions:
        name: permissions
        description: The access the file's top-level `permissions` key gives every
          job's GITHUB_TOKEN. Absent when the file sets none, so the repository's
          or organization's default applies; a scope the map leaves out gets no access.
        range: gha_permission
        multivalued: true
      jobs:
        name: jobs
        description: The jobs under the file's `jobs` key.
        range: GhaWorkflowJob
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: gha:Workflow
  GhaReusableWorkflow:
    name: GhaReusableWorkflow
    definition_uri: https://w3id.org/lmodel/github-actions/GhaReusableWorkflow
    description: A workflow that other workflows call as a job, because its `on` key
      names `workflow_call`; it declares the inputs, outputs and secrets its callers
      pass and read.
    comments:
    - 'When it generates provenance it is the builder: GitHub''s build type sets builder.id
      to the server''s address followed by the job''s workflow reference, which names
      this file and its ref.'
    from_schema: https://w3id.org/lmodel/github-actions/github_actions_workflow
    see_also:
    - https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations
    - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onworkflow_call
    exact_mappings:
    - gha:ReusableWorkflow
    is_a: GhaWorkflow
    slots:
    - ghaWorkflow__workflow_uri
    - ghaWorkflow__workflow_path
    - ghaWorkflow__workflow_repository
    - ghaWorkflow__permissions
    - ghaWorkflow__jobs
    - GhaReusableWorkflow_inputs
    - GhaReusableWorkflow_outputs
    - ghaReusableWorkflow__secrets
    - GhaReusableWorkflow_triggers
    slot_usage:
      triggers:
        name: triggers
        has_member:
          equals_string: workflow_call
      inputs:
        name: inputs
        description: The inputs under the file's `on.workflow_call.inputs` key.
        range: GhaWorkflowInput
      outputs:
        name: outputs
        description: The outputs under the file's `on.workflow_call.outputs` key.
        range: GhaWorkflowOutput
    attributes:
      secrets:
        name: secrets
        description: The secrets under the file's `on.workflow_call.secrets` key,
          by name only; no value is ever recorded.
        range: GhaWorkflowSecret
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: gha:ReusableWorkflow
  GhaWorkflowJob:
    name: GhaWorkflowJob
    definition_uri: https://w3id.org/lmodel/github-actions/GhaWorkflowJob
    description: 'A job under a workflow''s `jobs` key: steps that run on a runner,
      or a call to a reusable workflow.'
    from_schema: https://w3id.org/lmodel/github-actions/github_actions_workflow
    see_also:
    - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobs
    exact_mappings:
    - gha:WorkflowJob
    slots:
    - ghaWorkflowJob__job_id
    - ghaWorkflowJob__job_name
    - ghaWorkflowJob__calls
    - ghaWorkflowJob__runs_on
    - ghaWorkflowJob__runner_group
    - ghaWorkflowJob__runner_environment
    - ghaWorkflowJob__job_permissions
    attributes:
      job_id:
        name: job_id
        description: The job's key under `jobs`.
        range: gha_identifier
        required: true
      job_name:
        name: job_name
        description: The job's `name`, which GitHub shows and its check run takes;
          the check run takes the job's id when it has none.
        see_also:
        - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idname
      calls:
        name: calls
        description: 'The reusable workflow the job runs, its `uses` value: `./.github/workflows/<file>`
          in the same repository, or `<owner>/<repo>/.github/workflows/<file>@<ref>`.'
        see_also:
        - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_iduses
        pattern: ^(.+\/)+(.+)\.(ya?ml)(@.+)?$
      runs_on:
        name: runs_on
        description: 'The runner labels from the job''s `runs-on`: one label, a list,
          or the `labels` of a group. A runner must carry every one.'
        see_also:
        - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idruns-on
        multivalued: true
      runner_group:
        name: runner_group
        description: The runner group the job's `runs-on.group` names.
        see_also:
        - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#choosing-runners-in-a-group
      runner_environment:
        name: runner_environment
        description: Whether the job's runner is hosted by GitHub or by the repository's
          owner, as GitHub's build type records runner_environment for a run.
        range: GhaRunnerEnvironment
      job_permissions:
        name: job_permissions
        description: The access the job's own `permissions` key gives its GITHUB_TOKEN,
          in place of the workflow's. A called workflow can lower its token's access,
          never raise it.
        see_also:
        - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idpermissions
        range: gha_permission
        multivalued: true
    class_uri: gha:WorkflowJob
    rules:
    - preconditions:
        slot_conditions:
          calls:
            name: calls
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          runs_on:
            name: runs_on
            value_presence: ABSENT
      description: 'A job that calls a reusable workflow names no runner labels: a
        calling job takes no `runs-on` key, and the called workflow''s jobs choose
        their own runners.'
    - preconditions:
        slot_conditions:
          calls:
            name: calls
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          runner_group:
            name: runner_group
            value_presence: ABSENT
      description: A job that calls a reusable workflow names no runner group.
  GhaWorkflowInput:
    name: GhaWorkflowInput
    definition_uri: https://w3id.org/lmodel/github-actions/GhaWorkflowInput
    description: An input under a reusable workflow's `on.workflow_call.inputs` key.
    from_schema: https://w3id.org/lmodel/github-actions/github_actions_workflow
    see_also:
    - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onworkflow_callinputs
    exact_mappings:
    - gha:WorkflowInput
    is_a: GhaInput
    slots:
    - description
    - ghaInput__input_id
    - ghaInput__default
    - ghaRequiredMixin__required
    - ghaWorkflowInput__input_type
    attributes:
      input_type:
        name: input_type
        description: The input's `type`, which a reusable workflow's input must state.
          Named input_type because a knowledge bundle reads `type` as the class of
          the concept.
        see_also:
        - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onworkflow_callinputsinput_idtype
        range: GhaWorkflowInputType
        required: true
    class_uri: gha:WorkflowInput
  GhaWorkflowOutput:
    name: GhaWorkflowOutput
    definition_uri: https://w3id.org/lmodel/github-actions/GhaWorkflowOutput
    description: An output under a reusable workflow's `on.workflow_call.outputs`
      key, set from an output of one of its jobs.
    from_schema: https://w3id.org/lmodel/github-actions/github_actions_workflow
    see_also:
    - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onworkflow_calloutputs
    exact_mappings:
    - gha:WorkflowOutput
    is_a: GhaOutput
    slots:
    - description
    - ghaOutput__output_id
    - GhaWorkflowOutput_output_expression
    slot_usage:
      output_expression:
        name: output_expression
        required: true
    class_uri: gha:WorkflowOutput
  GhaWorkflowSecret:
    name: GhaWorkflowSecret
    definition_uri: https://w3id.org/lmodel/github-actions/GhaWorkflowSecret
    description: A secret under a reusable workflow's `on.workflow_call.secrets` key,
      by name; its value is never recorded.
    from_schema: https://w3id.org/lmodel/github-actions/github_actions_workflow
    see_also:
    - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onworkflow_callsecrets
    exact_mappings:
    - gha:WorkflowSecret
    mixins:
    - GhaRequiredMixin
    slots:
    - description
    - ghaWorkflowSecret__secret_id
    - ghaRequiredMixin__required
    attributes:
      secret_id:
        name: secret_id
        description: The key a caller passes the secret under.
        range: gha_identifier
        required: true
    class_uri: gha:WorkflowSecret
  GhaAction:
    name: GhaAction
    definition_uri: https://w3id.org/lmodel/github-actions/GhaAction
    description: 'An action: a directory whose `action.yml` or `action.yaml` file
      names its inputs, its outputs and the runtime that executes it. A workflow step
      runs it with `uses`.'
    comments:
    - SLSA counts the actions a build runs among its steps, which the tenant defines;
      an action is never a build's trust boundary, as a reusable workflow that signs
      provenance is.
    - The metadata file's name and description are the concept's title and description
      in a knowledge bundle, so the class adds neither.
    from_schema: https://w3id.org/lmodel/github-actions/github_actions_action
    see_also:
    - https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax
    exact_mappings:
    - gha:Action
    close_mappings:
    - cdx:task
    slots:
    - GhaAction_inputs
    - GhaAction_outputs
    - ghaAction__action_uri
    - ghaAction__action_path
    - ghaAction__using
    slot_usage:
      inputs:
        name: inputs
        description: The inputs under the metadata file's `inputs` key.
        range: GhaActionInput
      outputs:
        name: outputs
        description: The outputs under the metadata file's `outputs` key.
        range: GhaActionOutput
    attributes:
      action_uri:
        name: action_uri
        description: 'The action''s address on its forge without a ref: `https://github.com/<owner>/<repo>`,
          followed by the directory''s path when the action is not at the repository
          root. A step''s `uses` names it as `<owner>/<repo>/<path>@<ref>`.'
        identifier: true
        range: uri
      action_path:
        name: action_path
        description: The metadata file's path from the repository root.
        required: true
        pattern: ^(.+/)?action\.ya?ml$
      using:
        name: using
        description: The runtime that executes the action, its `runs.using` value.
        range: GhaActionRuntime
        required: true
    class_uri: gha:Action
  GhaActionInput:
    name: GhaActionInput
    definition_uri: https://w3id.org/lmodel/github-actions/GhaActionInput
    description: An input under an action's `inputs` key.
    from_schema: https://w3id.org/lmodel/github-actions/github_actions_action
    see_also:
    - https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax#inputs
    exact_mappings:
    - gha:ActionInput
    is_a: GhaInput
    slots:
    - ghaInput__input_id
    - ghaInput__default
    - ghaRequiredMixin__required
    - ghaActionInput__deprecation_message
    - GhaActionInput_description
    slot_usage:
      description:
        name: description
        required: true
    attributes:
      deprecation_message:
        name: deprecation_message
        description: The message GitHub shows a workflow that still passes the input,
          the file's `deprecationMessage`; present only when the input is deprecated.
        see_also:
        - https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax#inputsinput_iddeprecationmessage
    class_uri: gha:ActionInput
  GhaActionOutput:
    name: GhaActionOutput
    definition_uri: https://w3id.org/lmodel/github-actions/GhaActionOutput
    description: An output under an action's `outputs` key.
    comments:
    - Only a composite action sets an output from an expression; a Docker or JavaScript
      action writes its outputs while it runs, so its outputs have no output_expression.
    from_schema: https://w3id.org/lmodel/github-actions/github_actions_action
    see_also:
    - https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax#outputs-for-docker-container-and-javascript-actions
    - https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax#outputs-for-composite-actions
    exact_mappings:
    - gha:ActionOutput
    is_a: GhaOutput
    slots:
    - output_expression
    - ghaOutput__output_id
    - GhaActionOutput_description
    slot_usage:
      description:
        name: description
        required: true
    class_uri: gha:ActionOutput
  GhaRepositoryRuleset:
    name: GhaRepositoryRuleset
    definition_uri: https://w3id.org/lmodel/github-actions/GhaRepositoryRuleset
    description: 'A ruleset: named rules that GitHub enforces on the branches, tags
      or pushes of a repository, or of every repository in an organization or enterprise
      that it targets.'
    comments:
    - SLSA's Source track calls such rules technical controls on protected named references,
      and asks that their meaning be documented and their enforcement recorded in
      attestations; the slsa schema models that evidence.
    - Of the rules' parameters, only those of required_status_checks are modelled,
      as GhaRequiredStatusCheck; rule_types says which other rules the ruleset holds.
    from_schema: https://w3id.org/lmodel/github-actions/github_actions_rules
    see_also:
    - https://docs.github.com/en/rest/repos/rules
    - https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/available-rules-for-rulesets
    exact_mappings:
    - gha:RepositoryRuleset
    slots:
    - ghaRepositoryRuleset__ruleset_uri
    - ghaRepositoryRuleset__ruleset_id
    - ghaRepositoryRuleset__ruleset_source_type
    - ghaRepositoryRuleset__ruleset_source
    - ghaRepositoryRuleset__ruleset_target
    - ghaRepositoryRuleset__enforcement
    - ghaRepositoryRuleset__ref_name_include
    - ghaRepositoryRuleset__ref_name_exclude
    - ghaRepositoryRuleset__bypass_actors
    - ghaRepositoryRuleset__rule_types
    - ghaRepositoryRuleset__requires_check
    attributes:
      ruleset_uri:
        name: ruleset_uri
        description: The ruleset's page, the REST response's `_links.html.href`, such
          as `https://github.com/<owner>/<repo>/rules/<id>`.
        identifier: true
        range: uri
      ruleset_id:
        name: ruleset_id
        description: The ruleset's numeric `id` in the REST API.
        range: integer
        minimum_value: 1
      ruleset_source_type:
        name: ruleset_source_type
        description: 'What owns the ruleset, the REST field `source_type`: a repository,
          an organization or an enterprise.'
        range: GhaRulesetSourceType
      ruleset_source:
        name: ruleset_source
        description: The name of the repository, organization or enterprise that owns
          the ruleset, the REST field `source`, such as `<owner>/<repo>`.
      ruleset_target:
        name: ruleset_target
        description: What the ruleset applies to, the REST field `target`. Named ruleset_target
          because LOKF defines a target slot of its own.
        range: GhaRulesetTarget
        required: true
      enforcement:
        name: enforcement
        description: Whether GitHub enforces the ruleset, the REST field `enforcement`.
        range: GhaRulesetEnforcement
        required: true
      ref_name_include:
        name: ref_name_include
        description: 'The refs the ruleset applies to, from `conditions.ref_name.include`:
          names or patterns such as `refs/heads/main`, or `~DEFAULT_BRANCH` or `~ALL`.
          A ref must match one of them.'
        multivalued: true
      ref_name_exclude:
        name: ref_name_exclude
        description: The refs the ruleset leaves out, from `conditions.ref_name.exclude`,
          even when they match an included one.
        multivalued: true
      bypass_actors:
        name: bypass_actors
        description: The actors who may bypass the ruleset.
        range: GhaBypassActor
        multivalued: true
        inlined: true
        inlined_as_list: true
      rule_types:
        name: rule_types
        description: The `type` of each rule the ruleset holds, such as `deletion`,
          `non_fast_forward`, `pull_request` or `required_status_checks`.
        comments:
        - A pattern rather than an enumeration, because GitHub adds rule types.
        multivalued: true
        pattern: ^[a-z_]+$
      requires_check:
        name: requires_check
        description: The status checks the ruleset's required_status_checks rule requires,
          each a concept of its own.
        range: GhaRequiredStatusCheck
        multivalued: true
    class_uri: gha:RepositoryRuleset
  GhaBypassActor:
    name: GhaBypassActor
    definition_uri: https://w3id.org/lmodel/github-actions/GhaBypassActor
    description: An actor who may bypass a ruleset, and when.
    from_schema: https://w3id.org/lmodel/github-actions/github_actions_rules
    see_also:
    - https://docs.github.com/en/rest/repos/rules
    exact_mappings:
    - gha:BypassActor
    slots:
    - ghaBypassActor__actor_id
    - ghaBypassActor__actor_type
    - ghaBypassActor__bypass_mode
    attributes:
      actor_id:
        name: actor_id
        description: The actor's numeric id; absent for an actor type GitHub takes
          no id for, such as DeployKey or OrganizationAdmin.
        range: integer
      actor_type:
        name: actor_type
        description: The kind of actor, the REST field `actor_type`, such as `Team`,
          `RepositoryRole`, `Integration` or `OrganizationAdmin`.
        comments:
        - A pattern rather than an enumeration, because GitHub adds actor types.
        required: true
        pattern: ^[A-Z][A-Za-z]+$
      bypass_mode:
        name: bypass_mode
        description: When the actor may bypass, the REST field `bypass_mode`, such
          as `always`, `pull_request` or `exempt`; GitHub's default is `always`.
        comments:
        - A pattern rather than an enumeration, because GitHub adds bypass modes.
        pattern: ^[a-z_]+$
    class_uri: gha:BypassActor
  GhaRequiredStatusCheck:
    name: GhaRequiredStatusCheck
    definition_uri: https://w3id.org/lmodel/github-actions/GhaRequiredStatusCheck
    description: A status check that a ruleset requires to pass before a change reaches
      a ref it targets, named by the context a check run must report.
    comments:
    - 'GitHub Actions reports each job as a check run named after the job: its name,
      or its id when it has none. A job of a called workflow is named after the calling
      job and the called job, joined by a slash with a space on each side, as the
      otterdog documentation states (https://otterdog.readthedocs.io/en/latest/reference/organization/repository/status-check/).
      A matrix job''s check name adds its matrix values in parentheses.'
    - A job that its own `if` skips reports success, so its required check passes
      without running. A path filter skips the whole run, and a calling job's `if`
      skips the call, which GitHub reports under the caller's name alone; either way
      no check run carries the check's name, so the required check stays pending and
      blocks the merge. skip_conditions records what can skip the job, so a reader
      can see both.
    - SLSA's Source track lets an organization carry such a control into a Source
      Verification Summary Attestation as an ORG_SOURCE_ property, whose meaning the
      organization defines; slsa-framework's source-tool emits one as GH_REQUIRED_CHECK_
      followed by the check's name.
    - in-toto's Test Result predicate is the shape of an attestation of what the check
      found, so it is a related term and not a close one.
    from_schema: https://w3id.org/lmodel/github-actions/github_actions_rules
    see_also:
    - https://docs.github.com/en/rest/repos/rules
    - https://docs.github.com/en/rest/checks/runs
    - https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/about-status-checks
    - https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
    exact_mappings:
    - gha:RequiredStatusCheck
    related_mappings:
    - in_toto:test-result/v0.1
    slots:
    - ghaRequiredStatusCheck__check_uri
    - ghaRequiredStatusCheck__check_context
    - ghaRequiredStatusCheck__integration_id
    - ghaRequiredStatusCheck__strict_policy
    - ghaRequiredStatusCheck__do_not_enforce_on_create
    - ghaRequiredStatusCheck__job_path
    - ghaRequiredStatusCheck__skip_conditions
    - ghaRequiredStatusCheck__emitted_by
    attributes:
      check_uri:
        name: check_uri
        description: An identifier for the requirement. GitHub gives a required check
          no address of its own; in a knowledge bundle the concept's `id` takes its
          place.
        identifier: true
        range: uri
      check_context:
        name: check_context
        description: The context a check run must report, the rule's `required_status_checks[].context`.
          Named check_context because LOKF defines a context slot of its own.
        required: true
        pattern: \S
      integration_id:
        name: integration_id
        description: The GitHub App the check must come from, the rule's `integration_id`;
          GitHub Actions is app 15368.
        range: integer
        minimum_value: 1
      strict_policy:
        name: strict_policy
        description: Whether a pull request must be tested against the latest code
          of the branch it targets, the rule's `strict_required_status_checks_policy`.
        range: boolean
      do_not_enforce_on_create:
        name: do_not_enforce_on_create
        description: Whether a branch may be created although the check would otherwise
          stop it, the rule's `do_not_enforce_on_create`.
        range: boolean
      job_path:
        name: job_path
        description: 'The ids of the jobs from the top-level workflow''s job to the
          job that reports the check: one id for a job of the workflow itself, the
          calling job''s id first for a job of a called workflow.'
        list_elements_ordered: true
        range: gha_identifier
        multivalued: true
      skip_conditions:
        name: skip_conditions
        description: What in the workflow can skip the job that reports the check,
          each written as its key's path in the file, such as `on.pull_request.paths`
          or `jobs.test.if`.
        multivalued: true
        pattern: ^(on|jobs)\.\S+$
      emitted_by:
        name: emitted_by
        description: The top-level workflow whose job reports the check.
        range: GhaWorkflow
    class_uri: gha:RequiredStatusCheck
