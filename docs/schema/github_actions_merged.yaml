        from_schema: https://w3id.org/lmodel/github-actions/github_actions_workflow
        see_also:
        - https://actions.github.io/buildtypes/workflow/v1
        owner: GhaReusableWorkflow
        domain_of:
        - GhaWorkflow
        range: uri
        pattern: ^https://[^/]+/[^/]+/[^/]+$
      permissions:
        name: permissions
        description: The access the file's top-level `permissions` key gives every
