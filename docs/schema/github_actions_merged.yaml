name: github_actions
annotations:
  schemastore_commit:
    tag: schemastore_commit
    value: f7c2f3bcb512651bd980ed6896639ea8ded9ddf0
  rest_api_version:
    tag: rest_api_version
    value: '2026-03-10'
  docs_read:
    tag: docs_read
    value: '2026-10-28'
description: 'A LinkML model of what GitHub Actions files and repository rulesets
  state: workflows and their jobs, reusable workflows with their inputs, outputs and
  secrets, actions with their runtimes, and the rulesets and required status checks
  that tie a workflow''s jobs to the refs a ruleset protects.'
title: GitHub Actions workflows, actions and repository rulesets
comments:
- GitHub's documentation is versionless, so the version is the date its pages were
  read. With the SchemaStore commit in source and the REST API version in the annotations,
  it says which state of GitHub the model renders; scripts/check_upstream_release.py
  reads the same three pins and reports when one moves. The release tags are the schema's
  own versions.
- github_actions_core imports only the LinkML types, the workflow and action modules
  import the core, the rules module imports the workflow module, and this file adds
  only the document root, so an importer can take one module.
source: https://github.com/SchemaStore/schemastore/tree/f7c2f3bcb512651bd980ed6896639ea8ded9ddf0/src/schemas/json
see_also:
- https://lmodel.github.io/github-actions
- https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
- https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax
- https://docs.github.com/en/rest/repos/rules
- https://docs.github.com/en/rest/checks/runs
- https://actions.github.io/buildtypes/workflow/v1
id: https://w3id.org/lmodel/github-actions
version: '2026-10-28'
license: Apache-2.0
prefixes:
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  gha:
    prefix_prefix: gha
    prefix_reference: https://w3id.org/lmodel/github-actions/
  xsd:
    prefix_prefix: xsd
    prefix_reference: http://www.w3.org/2001/XMLSchema#
  shex:
    prefix_prefix: shex
    prefix_reference: http://www.w3.org/ns/shex#
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
  cdx:
    prefix_prefix: cdx
    prefix_reference: http://cyclonedx.org/schema/bom-1.7.schema.json#/definitions/
  spdx_build:
    prefix_prefix: spdx_build
    prefix_reference: https://spdx.org/rdf/3.0.1/terms/Build/
  in_toto:
    prefix_prefix: in_toto
    prefix_reference: https://in-toto.io/attestation/
default_prefix: gha
default_range: string
types:
  string:
    name: string
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/lmodel/github-actions
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/lmodel/github-actions
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/lmodel/github-actions
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/lmodel/github-actions
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/lmodel/github-actions
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/lmodel/github-actions
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/lmodel/github-actions
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/lmodel/github-actions
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/lmodel/github-actions
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/lmodel/github-actions
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/lmodel/github-actions
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/lmodel/github-actions
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/lmodel/github-actions
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/lmodel/github-actions
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/lmodel/github-actions
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/lmodel/github-actions
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/lmodel/github-actions
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/lmodel/github-actions
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/lmodel/github-actions
    base: str
    uri: xsd:string
    repr: str
  gha_identifier:
    name: gha_identifier
    description: 'A key GitHub accepts for a job, an input, an output or a secret:
      a letter or an underscore, then letters, digits, hyphens or underscores.'
    from_schema: https://w3id.org/lmodel/github-actions
    see_also:
    - https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax#inputsinput_id
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[_a-zA-Z][a-zA-Z0-9_-]*$
  gha_permission:
    name: gha_permission
    description: One grant of access to a workflow's GITHUB_TOKEN, written as the
      scope, a colon and `read`, `write` or `none`; `read-all`, `write-all` or `{}`
      stands alone for the shorthand of the same name or the empty map.
    comments:
    - A pattern rather than an enumeration of scopes, because GitHub adds scopes;
      tests/test_schema_rules.py checks that it admits every scope SchemaStore's schema
      lists at the pinned commit.
    from_schema: https://w3id.org/lmodel/github-actions
    see_also:
    - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
    typeof: string
    base: str
    uri: xsd:string
    pattern: '^(read-all|write-all|\{\}|[a-z][a-z-]*: (read|write|none))$'
enums:
  GhaWorkflowInputType:
    name: GhaWorkflowInputType
    description: The types a reusable workflow's input may state.
    from_schema: https://w3id.org/lmodel/github-actions
    see_also:
    - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onworkflow_callinputsinput_idtype
    permissible_values:
      boolean:
        text: boolean
        description: True or false.
      number:
        text: number
        description: A number.
      string:
        text: string
        description: A string.
  GhaRunnerEnvironment:
    name: GhaRunnerEnvironment
    description: Who hosts the runner a job runs on, as GitHub's build type records
      it.
    from_schema: https://w3id.org/lmodel/github-actions
    see_also:
    - https://actions.github.io/buildtypes/workflow/v1
    permissible_values:
      github-hosted:
        text: github-hosted
        description: A runner that GitHub hosts.
        title: GitHub-hosted
      self-hosted:
        text: self-hosted
        description: A runner that the repository's owner hosts.
        title: Self-hosted
  GhaActionRuntime:
    name: GhaActionRuntime
    description: The runtimes an action's `runs.using` may name.
    comments:
    - SchemaStore's schema at the pinned commit also accepts node12 and node16, which
      GitHub's metadata syntax page no longer lists; tests/test_schema_rules.py checks
      that those two are the only difference.
    from_schema: https://w3id.org/lmodel/github-actions
    see_also:
    - https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax#runs-for-composite-actions
    - https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax#runs-for-javascript-actions
    - https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax#runs-for-docker-container-actions
    permissible_values:
      composite:
        text: composite
        description: Steps that run in the calling job, as a workflow's steps do.
      docker:
        text: docker
        description: A Docker container.
      node20:
        text: node20
        description: JavaScript, run by Node.js 20.
      node24:
        text: node24
        description: JavaScript, run by Node.js 24.
  GhaRulesetSourceType:
    name: GhaRulesetSourceType
    description: What can own a ruleset, as the REST field `source_type` names it.
    from_schema: https://w3id.org/lmodel/github-actions
    see_also:
    - https://docs.github.com/en/rest/repos/rules
    permissible_values:
      Repository:
        text: Repository
        description: A repository's own ruleset.
      Organization:
        text: Organization
        description: An organization's ruleset, applied to the repositories it targets.
      Enterprise:
        text: Enterprise
        description: An enterprise's ruleset, applied to the repositories it targets.
  GhaRulesetTarget:
    name: GhaRulesetTarget
    description: What a ruleset applies to, as the REST field `target` names it.
    from_schema: https://w3id.org/lmodel/github-actions
    see_also:
    - https://docs.github.com/en/rest/repos/rules
    permissible_values:
      branch:
        text: branch
        description: Branches; GitHub's default.
      tag:
        text: tag
        description: Tags.
      push:
        text: push
        description: Pushes, by the files they change.
  GhaRulesetEnforcement:
    name: GhaRulesetEnforcement
    description: Whether GitHub enforces a ruleset, as the REST field `enforcement`
      names it.
    from_schema: https://w3id.org/lmodel/github-actions
    see_also:
    - https://docs.github.com/en/rest/repos/rules
    permissible_values:
      active:
        text: active
        description: Enforced.
      evaluate:
        text: evaluate
        description: Evaluated and reported but not enforced, so administrators can
          test its rules; only on GitHub Enterprise.
      disabled:
        text: disabled
        description: Neither enforced nor evaluated.
slots:
  description:
    name: description
    description: What the input, output or secret is for, as the file describes it.
    comments:
    - It means what LOKF's description means and carries the same IRI, so lokf adapt
      folds it into LOKF's slot and a knowledge bundle reads one description key.
    from_schema: https://w3id.org/lmodel/github-actions
    slot_uri: schema:description
    domain_of:
    - GhaInput
    - GhaOutput
    - GhaWorkflowSecret
  inputs:
    name: inputs
    description: The inputs that the reusable workflow or the action declares.
    from_schema: https://w3id.org/lmodel/github-actions
    domain_of:
    - GhaReusableWorkflow
    - GhaAction
    range: GhaInput
    multivalued: true
    inlined: true
    inlined_as_list: true
  outputs:
    name: outputs
    description: The outputs that the reusable workflow or the action declares.
    from_schema: https://w3id.org/lmodel/github-actions
    domain_of:
    - GhaReusableWorkflow
    - GhaAction
    range: GhaOutput
    multivalued: true
    inlined: true
    inlined_as_list: true
  output_expression:
    name: output_expression
    description: The expression that sets the output, the file's `value` key, such
      as one that reads an output of a job or a step.
    comments:
    - A slot rather than an attribute because GhaWorkflowOutput refines it.
    from_schema: https://w3id.org/lmodel/github-actions
    slot_uri: gha:output_expression
    domain_of:
    - GhaOutput
  triggers:
    name: triggers
    description: The names of the events under the file's `on` key, such as `push`,
      `pull_request`, `schedule` or `workflow_call`.
    comments:
    - A slot rather than an attribute because GhaReusableWorkflow refines it; a pattern
      rather than an enumeration, because GitHub adds events.
    from_schema: https://w3id.org/lmodel/github-actions
    see_also:
    - https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
    related_mappings:
    - cdx:trigger
    slot_uri: gha:triggers
    domain_of:
    - GhaWorkflow
    multivalued: true
    pattern: ^[a-z_]+$
classes:
  GhaDocument:
    name: GhaDocument
    description: A document that holds the workflows, actions, rulesets and required
      status checks of one or more repositories.
    from_schema: https://w3id.org/lmodel/github-actions
    attributes:
      workflows:
        name: workflows
        description: The workflows other than the reusable ones.
        from_schema: https://w3id.org/lmodel/github-actions
        owner: GhaDocument
        domain_of:
        - GhaDocument
        range: GhaWorkflow
        multivalued: true
        inlined: true
        inlined_as_list: true
      reusable_workflows:
        name: reusable_workflows
        description: The reusable workflows.
        from_schema: https://w3id.org/lmodel/github-actions
        owner: GhaDocument
        domain_of:
        - GhaDocument
        range: GhaReusableWorkflow
        multivalued: true
        inlined: true
        inlined_as_list: true
      actions:
        name: actions
        description: The actions.
        from_schema: https://w3id.org/lmodel/github-actions
        owner: GhaDocument
        domain_of:
        - GhaDocument
        range: GhaAction
        multivalued: true
        inlined: true
        inlined_as_list: true
      rulesets:
        name: rulesets
        description: The rulesets.
        from_schema: https://w3id.org/lmodel/github-actions
        owner: GhaDocument
        domain_of:
        - GhaDocument
        range: GhaRepositoryRuleset
        multivalued: true
        inlined: true
        inlined_as_list: true
      required_checks:
        name: required_checks
        description: The status checks the rulesets require.
        from_schema: https://w3id.org/lmodel/github-actions
        owner: GhaDocument
        domain_of:
        - GhaDocument
        range: GhaRequiredStatusCheck
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: gha:Document
    tree_root: true
  GhaRequiredMixin:
    name: GhaRequiredMixin
    description: The field that says whether a caller must supply a value.
    from_schema: https://w3id.org/lmodel/github-actions
    mixin: true
    attributes:
      required:
        name: required
        description: Whether a caller must supply a value.
        comments:
        - 'An attribute rather than a slot: it carries LOKF''s IRI for required, and
          lokf adapt keeps an attribute''s name, where it would rename a slot that
          shares one with lokf.yaml.'
        from_schema: https://w3id.org/lmodel/github-actions/github_actions_core
        slot_uri: schema:valueRequired
        owner: GhaRequiredMixin
        domain_of:
        - GhaRequiredMixin
        range: boolean
  GhaInput:
    name: GhaInput
    description: An input that a reusable workflow or an action declares, under the
      key a caller writes in its `with` map.
    from_schema: https://w3id.org/lmodel/github-actions
    abstract: true
    mixins:
    - GhaRequiredMixin
    slots:
    - description
    attributes:
      input_id:
        name: input_id
        description: The key a caller writes in its `with` map.
        from_schema: https://w3id.org/lmodel/github-actions/github_actions_core
        owner: GhaInput
        domain_of:
        - GhaInput
        range: gha_identifier
        required: true
      default:
        name: default
        description: The value used when a caller supplies none, written as a string
          even where the input's type is a boolean or a number.
        from_schema: https://w3id.org/lmodel/github-actions/github_actions_core
        owner: GhaInput
        domain_of:
        - GhaInput
        range: string
      description:
        name: description
        description: What the input, output or secret is for, as the file describes
          it.
        comments:
        - It means what LOKF's description means and carries the same IRI, so lokf
          adapt folds it into LOKF's slot and a knowledge bundle reads one description
          key.
        from_schema: https://w3id.org/lmodel/github-actions
        slot_uri: schema:description
        owner: GhaInput
        domain_of:
        - GhaInput
        - GhaOutput
        - GhaWorkflowSecret
        range: string
      required:
        name: required
        description: Whether a caller must supply a value.
        comments:
        - 'An attribute rather than a slot: it carries LOKF''s IRI for required, and
          lokf adapt keeps an attribute''s name, where it would rename a slot that
          shares one with lokf.yaml.'
        from_schema: https://w3id.org/lmodel/github-actions/github_actions_core
        slot_uri: schema:valueRequired
        owner: GhaInput
        domain_of:
        - GhaRequiredMixin
        range: boolean
    class_uri: gha:Input
  GhaOutput:
    name: GhaOutput
    description: An output that a reusable workflow or an action declares for the
      job or step that calls it to read.
    from_schema: https://w3id.org/lmodel/github-actions
    abstract: true
    slots:
    - description
    - output_expression
    attributes:
      output_id:
        name: output_id
        description: The key a caller reads the output by.
        from_schema: https://w3id.org/lmodel/github-actions/github_actions_core
        owner: GhaOutput
        domain_of:
        - GhaOutput
        range: gha_identifier
        required: true
      description:
        name: description
        description: What the input, output or secret is for, as the file describes
          it.
        comments:
        - It means what LOKF's description means and carries the same IRI, so lokf
          adapt folds it into LOKF's slot and a knowledge bundle reads one description
          key.
        from_schema: https://w3id.org/lmodel/github-actions
        slot_uri: schema:description
        owner: GhaOutput
        domain_of:
        - GhaInput
        - GhaOutput
        - GhaWorkflowSecret
        range: string
      output_expression:
        name: output_expression
        description: The expression that sets the output, the file's `value` key,
          such as one that reads an output of a job or a step.
        comments:
        - A slot rather than an attribute because GhaWorkflowOutput refines it.
        from_schema: https://w3id.org/lmodel/github-actions
        slot_uri: gha:output_expression
        owner: GhaOutput
        domain_of:
        - GhaOutput
        range: string
    class_uri: gha:Output
  GhaWorkflow:
    name: GhaWorkflow
    description: 'A workflow file in a repository''s `.github/workflows` directory:
      the events that run it, the access its GITHUB_TOKEN gets, and its jobs.'
    comments:
    - SPDX 3.0.1's Build records one run of a build, such as a run of this workflow,
      so it is a related term and not a close one.
    - The ref a run checks the file out at belongs to the run, and GitHub's build
      type records it in provenance as workflow.ref; it is not a fact of the file,
      so it is not modelled here.
    from_schema: https://w3id.org/lmodel/github-actions
    see_also:
    - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
    close_mappings:
    - cdx:workflow
    related_mappings:
    - spdx_build:Build
    slots:
    - triggers
    slot_usage:
      triggers:
        name: triggers
        required: true
    attributes:
      workflow_uri:
        name: workflow_uri
        description: 'The file''s address on its forge without a ref: `https://github.com/<owner>/<repo>/.github/workflows/<file>`.'
