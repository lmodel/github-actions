# A caller whose own `if` can skip the call. GitHub then reports a check run
# named `label` alone, so the check `label / ruff` stays pending.
name: Labels
on:
  pull_request:
permissions: {}
jobs:
  label:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/lint.yaml
