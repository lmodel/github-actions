name: Set up
description: A composite action with a deprecated input and an output read from a step.
inputs:
  python-version:
    description: The Python version to install.
    required: true
  cache:
    description: Whether to cache the dependencies.
    required: 'false'
    default: true
    deprecationMessage: The cache is always on; this input is ignored.
outputs:
  python-path:
    description: The path of the installed interpreter.
    value: ${{ steps.setup.outputs.python-path }}
runs:
  using: composite
  steps:
    - id: setup
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
