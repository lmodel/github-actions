ruleset_uri: https://github.com/example-org/service/rules/42
ruleset_id: 42
ruleset_source_type: Repository
ruleset_source: example-org/service
ruleset_target: branch
enforcement: active
ref_name_include:
  - ~DEFAULT_BRANCH
ref_name_exclude:
  - refs/heads/release/legacy-*
bypass_actors:
  - actor_id: 5
    actor_type: RepositoryRole
    bypass_mode: pull_request
  - actor_type: OrganizationAdmin
    bypass_mode: always
rule_types:
  - deletion
  - non_fast_forward
  - pull_request
  - required_status_checks
requires_check:
  - https://example.org/knowledge/service/checks/test-unit
